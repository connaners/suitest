packages:
  - "apps/web"
  - "packages/mcp-npx"
  - "docs-site"
allowBuilds:
  '@suiflex/kurir': true
  esbuild: true
  msw: true
  sharp: true
minimumReleaseAgeExclude:
  - '@suiflex/kurir@0.1.0'
onlyBuiltDependencies:
  - '@suiflex/kurir'
  - esbuild
  - sharp
  - msw
overrides:
  # Security floors (Dependabot): pin only the vulnerable ranges upward.
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "js-yaml@>=4.0.0 <4.3.0": "4.3.0"
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=3.0.0 <5.0.9": "5.0.9"
  "vite@>=6.0.0 <6.4.3": "6.4.3"
  "@babel/core@<7.29.6": "7.29.6"
  "uuid@>=9.0.0 <11.1.1": "11.1.1"
  "esbuild@<0.28.1": "0.28.1"
  "svgo@>=4.0.0 <4.0.2": "4.0.2"
  "postcss@<8.5.23": "8.5.23"
  "sharp@<0.35.0": "0.35.0"
