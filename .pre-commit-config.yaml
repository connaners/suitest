default_language_version:
  python: python3.12
  node: "20"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
        exclude: ^infra/helm/.*/templates/.*$
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this version in sync with the ruff version uv resolves from
    # pyproject.toml's dev-dependencies (currently 0.15.x). The pre-commit
    # formatter and ``uv run ruff format --check`` (the CI gate) MUST agree on
    # multi-line assert layout, otherwise the hook will revert CI-formatted
    # code on each commit. See Issue C1 in the M1a review notes.
    rev: v0.15.14
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # Tests are enforced at runtime (pytest) + lint (ruff); the hook-level
        # ``exclude`` below skips them (mirrors ``tools.mypy.exclude``).
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.6.0
          - sqlalchemy>=2.0.36
          - fastapi>=0.115.0
          - uvicorn>=0.32.0
          - httpx>=0.27.0
          - asgi-lifespan>=2.1.0
          - pytest>=8.3.0
          - pytest-asyncio>=0.24.0
          - fastapi-users[sqlalchemy,oauth]>=14.0.0
          - fastapi-users-db-sqlalchemy>=7.0.0
          - httpx-oauth>=0.16.0
          - arq>=0.26.3
          - cryptography>=42
          - structlog>=24.4.0
          - opentelemetry-api>=1.29.0
          - opentelemetry-sdk>=1.29.0
          - opentelemetry-exporter-otlp-proto-http>=1.29.0
          - opentelemetry-instrumentation-fastapi>=0.50b0
          - opentelemetry-instrumentation-sqlalchemy>=0.50b0
          - opentelemetry-instrumentation-httpx>=0.50b0
          - opentelemetry-instrumentation-asyncpg>=0.50b0
          - prometheus-fastapi-instrumentator>=7.0.0
          - slowapi>=0.1.9
          - mcp>=2.0.0
          - websockets>=12
          - redis[hiredis]>=5.0
          - anyio>=4.3
          - psycopg>=3.2
          - psycopg-pool>=3.2
          - alembic>=1.14.0
          - testcontainers[postgres]>=4.8.0
          # M1d-15 + M1d-29: respx is consumed by the slack adapter unit test
          # AND the auto-defect E2E to intercept Slack webhook POSTs without
          # touching the network. Without it the pre-commit mypy hook resolves
          # ``import respx`` to Any and trips ``disallow_any_unimported``.
          - respx>=0.21.0
          # M2-1: the deterministic OpenAPI generator parses specs
          # (openapi-pydantic), synthesises example bodies (faker), and falls
          # back to YAML (types-PyYAML stubs). Without these the isolated
          # pre-commit mypy env resolves the imports to Any and trips
          # ``disallow_any_unimported``.
          - openapi-pydantic>=0.4.0
          - faker>=25.0
          - types-PyYAML>=6.0
          # apps/api/src/suitest_api/services/uat_renderer.py subclasses
          # fpdf2's FPDF; without it mypy resolves the base class to Any and
          # trips ``disallow_any_unimported``. fpdf2 ships its own py.typed
          # inline types, so no separate stub package is needed — the
          # third-party types-fpdf2 stub was stale (typed set_font's size as
          # int; fpdf2 2.8.x actually accepts float) and produced false
          # positives here.
          - fpdf2>=2.8.5
          # api-http-mcp bundled server (packages/mcp/.../bundled/api_http.py)
          # parses PDFs via pypdf. Without it the isolated pre-commit mypy env
          # resolves the import to Any and trips ``disallow_any_unimported``.
          - pypdf>=6.1
          # M3-1/M3-4: the agent package (providers/litellm_router, graphs/*)
          # imports litellm + langgraph. Both ship py.typed; without them the
          # isolated pre-commit mypy env resolves the imports to Any and trips
          # ``disallow_any_unimported`` (CI's ``uv run mypy`` resolves them
          # because they are installed deps of suitest-agent).
          - litellm>=1.51
          - langgraph>=0.2.40
        args: ["--config-file=pyproject.toml"]
        files: ^(apps|packages)/.*\.py$
        # Tests are enforced at runtime (pytest) + lint (ruff). Their
        # per-package conftest.py files collide as duplicate mypy modules
        # (e.g. packages/agent/tests/conftest.py vs apps/api/tests/conftest.py),
        # so never hand them to the mypy hook. Every excluded file is still
        # fully type-checked by the authoritative per-package `mypy apps/*` /
        # `mypy packages/*` split in CI (.github/workflows/ci.yml), which runs
        # `mypy .` with `tools.mypy.exclude` covering the same test paths.
        # `packages/lifecycle` matches `files` but is deliberately NOT in the
        # CI mypy matrix (it pulls in untyped playwright async+sync APIs), so it
        # is excluded here too to keep the local hook aligned with the
        # authoritative gate.
        exclude: |
          (?x)^(
            .*/alembic/versions/.*
            | .*/tests/.*
            | packages/lifecycle/.*
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
